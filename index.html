<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Órdenes de Servicio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- PANEL LATERAL IZQUIERDO -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Nueva Orden</h1>
      </div>

      <form id="ordenForm" class="form">
        <!-- SECCIÓN: DATOS DEL CLIENTE -->
        <fieldset>
          <legend>Datos del Cliente</legend>
          <div class="form-group">
            <label for="clienteNombre">Nombre Completo *</label>
            <input type="text" id="clienteNombre" name="cliente_nombre" required>
          </div>
          <div class="form-group">
            <label for="clienteTelefono">Teléfono *</label>
            <input type="tel" id="clienteTelefono" name="cliente_telefono" required>
          </div>
          <div class="form-group">
            <label for="clienteEmail">Email</label>
            <input type="email" id="clienteEmail" name="cliente_email">
          </div>
          <div class="form-group">
            <label for="clienteDireccion">Dirección</label>
            <input type="text" id="clienteDireccion" name="cliente_direccion">
          </div>
        </fieldset>

        <!-- SECCIÓN: NÚMERO Y FECHA -->
        <fieldset>
          <legend>Detalles de Orden</legend>
          <div class="form-group">
            <label for="numeroOrden">Número de Orden *</label>
            <div class="input-group">
              <input type="text" id="numeroOrden" name="numero_orden" readonly>
              <button type="button" id="btnGenerarNumero" class="btn-icon">🔄</button>
            </div>
          </div>
          <div class="form-group">
            <label for="fecha">Fecha *</label>
            <input type="date" id="fecha" name="fecha" required>
          </div>
        </fieldset>

        <!-- SECCIÓN: DISPOSITIVO -->
        <fieldset>
          <legend>Dispositivo</legend>
          <div class="form-group">
            <label for="dispositivoTipo">Tipo de Dispositivo *</label>
            <select id="dispositivoTipo" name="dispositivo_tipo" required>
              <option value="">-- Seleccionar --</option>
              <option value="Celular">Celular</option>
              <option value="Computadora">Computadora</option>
              <option value="Tablet">Tablet</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dispositivoMarca">Marca</label>
            <input type="text" id="dispositivoMarca" name="dispositivo_marca" placeholder="ej: Samsung, Dell, Apple">
          </div>
          <div class="form-group">
            <label for="dispositivoModelo">Modelo</label>
            <input type="text" id="dispositivoModelo" name="dispositivo_modelo" placeholder="ej: Galaxy A50, XPS 13">
          </div>
        </fieldset>

        <!-- SECCIÓN: PROBLEMA Y SOLUCIÓN -->
        <fieldset>
          <legend>Trabajo</legend>
          <div class="form-group">
            <label for="problema">Problema Reportado *</label>
            <textarea id="problema" name="problema" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="trabajoRealizado">Trabajo Realizado *</label>
            <textarea id="trabajoRealizado" name="trabajo_realizado" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="componentes">Componentes Reemplazados</label>
            <textarea id="componentes" name="componentes" rows="2" placeholder="ej: Batería, Pantalla, SSD"></textarea>
          </div>
        </fieldset>

        <!-- SECCIÓN: COSTOS -->
        <fieldset>
          <legend>Costos</legend>
          <div class="form-group">
            <label for="costoManoObra">Mano de Obra ($) *</label>
            <input type="number" id="costoManoObra" name="costo_mano_obra" step="0.01" min="0" required>
          </div>
          <div class="form-group">
            <label for="costoPiezas">Piezas ($)</label>
            <input type="number" id="costoPiezas" name="costo_piezas" step="0.01" min="0">
          </div>
          <div class="total-display">
            <span>TOTAL:</span>
            <span id="totalOrden">$0.00</span>
          </div>
        </fieldset>

        <!-- SECCIÓN: OBSERVACIONES -->
        <fieldset>
          <legend>Observaciones</legend>
          <div class="form-group">
            <textarea id="observaciones" name="observaciones" rows="3" placeholder="Notas adicionales..."></textarea>
          </div>
        </fieldset>

        <!-- BOTONES -->
        <div class="form-actions">
          <button type="button" id="btnGuardar" class="btn btn-primary">💾 Guardar Orden</button>
          <button type="button" id="btnPDF" class="btn btn-success">📄 Generar PDF</button>
          <button type="reset" class="btn btn-secondary">🔄 Limpiar Formulario</button>
        </div>
      </form>
    </aside>

    <!-- ÁREA PRINCIPAL: VISTA PREVIA -->
    <main class="preview-area">
      <div class="preview-container">
        <div id="previewPDF" class="preview-content">
          <div class="preview-placeholder">
            <p>Completa el formulario para ver la vista previa</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
